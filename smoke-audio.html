<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>语音联调 · 不保存日志</title><style>body{color:#1b304c;max-width:700px;margin:40px auto;padding:0 20px;font:16px/1.7 system-ui,sans-serif}label{margin:22px 0;display:block}input,button{font:inherit;box-sizing:border-box;max-width:100%;margin-top:8px;padding:10px;display:block}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fa;padding:18px}small{color:#64748b}</style>  <script type="module" crossorigin src="/northstar/smoke-audio.js"></script>
</head>
<body><h1>语音联调</h1><p>只使用合成测试录音。读取当前登录身份，生成一份草稿，不读取或保存任何复盘。</p><form id="smoke-form"><label>合成 WAV 录音<input id="smoke-file" type="file" accept=".wav,audio/wav,audio/x-wav" required></label><label>录音时长（秒）<input id="smoke-duration" type="number" min="0.1" max="120" step="0.1" value="10" required></label><button id="smoke-submit" type="submit">测试语音转写（不保存）</button></form><small>需要在同一浏览器中先登录北极星复盘；此页不会显示登录凭据。</small><pre id="smoke-output" role="status" aria-live="polite">等待选择合成测试录音。</pre></body></html>
